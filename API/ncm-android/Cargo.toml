[package]
name = "ncm-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "ncm_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
ncm-api-rs = { path = "../ncm-api-rs" }
tokio = { version = "1", features = ["rt-multi-thread"] }
once_cell = "1"
jni = "0.21"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
