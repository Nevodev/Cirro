# Android 目标专用的体积开关。
#
# 为什么在这里而不是 Cargo.toml 的 [profile]：profile 里没有对应的键，这些是
# **代码生成 / 链接**层面的开关，只能走 rustflags。放在包目录下的 `.cargo/config.toml`
# 里，谁执行 `cargo ndk ...` 都会自动带上 —— 不用记环境变量，也不会跟别人手敲的
# `RUSTFLAGS` 冲突（环境变量优先级更高，会整体覆盖这里）。
#
# 🔴 实测（NDK r28.2 / arm64-v8a / 2026-10-09）：2.73MB → 2.17MB，**-20.6%**。
#
# ⚠️ 这些开关**只对 Android 目标生效**：host（`cargo check` / `--example` 探针）不受影响。

[target.aarch64-linux-android]
rustflags = [
    # 关掉 unwind 表。本库 `panic = "abort"`（见 Cargo.toml），异常永远不跨栈帧传播，
    # 但 Android 目标默认仍给每个函数生成 `.eh_frame` —— 实测白占 514KB（占整库 19%）。
    # 关掉后：.eh_frame 394K→101K、.eh_frame_hdr 120K→21K。
    # 代价：崩溃时系统 unwinder 穿不过本库的栈帧，native 崩溃报告里会缺本库那几帧
    # （只影响可读性，不影响崩溃本身）。调试期想看栈的话把这个参数摘掉重编即可。
    "-C", "force-unwind-tables=no",

    # Android 的 APS2「打包重定位」格式（设备端 API 23+ 支持）。.rela.dyn 138KB→19KB。
    # 本项目 minSdk = 30，远高于要求。
    "-C", "link-arg=-Wl,--pack-dyn-relocs=android",

    # 相同机器码的函数折叠（identical code folding）。Rust 不保证函数地址的同一性，
    # 折叠是安全的；.text 实测再省约 45KB。
    # ⚠️ 若怀疑遇到诡异行为，第一个该摘的就是这一条。
    "-C", "link-arg=-Wl,--icf=all",
]

[target.x86_64-linux-android]
rustflags = [
    "-C", "force-unwind-tables=no",
    "-C", "link-arg=-Wl,--pack-dyn-relocs=android",
    "-C", "link-arg=-Wl,--icf=all",
]
