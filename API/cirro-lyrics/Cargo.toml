[package]
name = "cirro-lyrics"
version = "0.1.0"
edition = "2021"
description = "Cirro 歌词取词引擎（网易 / AMLL TTML DB / Apple Music / lrclib）"
publish = false

[lib]
name = "cirro_lyrics"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 网易歌词要复用它已有的签名 / 加密与 cookie 处理，但**只作为依赖**，不改动它。
ncm-api-rs = { path = "../ncm-api-rs" }
# 第三方取词（AMLL DB / Apple amp-api / lrclib）走自己的裸 HTTP。
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
once_cell = "1"
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
# 只为解 Apple 开发者 token（JWT）的 header / payload 段。
base64 = "0.22"
# 只用来从 Apple 的 index*.js 里抠 JWT —— 刻意避开完整 `regex`（体积）。
regex-lite = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
